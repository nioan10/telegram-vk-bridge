name: telegram-vk-bridge
services:
  bridge:
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    volumes:
      - bridge-state:/app/state
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    stop_grace_period: 90s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  bridge-state:
